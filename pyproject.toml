[project]
name = "ampops"
version = "0.1.0"
description = "Automated, reproducible short-term load forecasting platform for smart grid reliability"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
# notebooks/ is excluded deliberately: they are EDA artifacts, and linting them
# to library standards (no unused imports, no semicolons) fights the medium.
exclude = ["mlruns", "mlartifacts", "data", ".venv", "notebooks", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" makes `import ampops` resolve without an editable install; "." keeps
# the DAG importable for the dags/ smoke test.
pythonpath = ["src", "."]
