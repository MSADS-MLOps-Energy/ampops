[project]
name = "ampops"
version = "0.1.0"
description = "Automated, reproducible short-term load forecasting platform for smart grid reliability"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["mlruns", "mlartifacts", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
