# AmpOps local stack.
#
# `docker compose up -d` brings up the training pipeline: postgres, mlflow, and
# Airflow (init/scheduler/webserver).
#
# The serving and dashboard services (api, redis, prometheus, grafana) are
# behind the "serving" profile so the training stack can come up without paying
# for a JVM, a Redis, and two dashboards. Start them with:
#     docker compose --profile serving up -d
# then `make seed-redis` — an unseeded feature store answers every /predict
# with 422, because there is no history to build a window from.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # src-layout: this is what makes `import ampops` resolve inside the DAG.
    PYTHONPATH: /opt/airflow/src
    # Absolute paths so ampops.config resolves the same way in every container.
    AMPOPS_DATA_DIR: /opt/airflow/data
    # Databricks is the default tracking backend when .env sets these.
    # Override with MLFLOW_TRACKING_URI=http://mlflow:5000 for compose-local MLflow.
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-databricks}
    MLFLOW_EXPERIMENT: ${MLFLOW_EXPERIMENT:-ampops-demand-forecasting}
    MLFLOW_REGISTRY_URI: ${MLFLOW_REGISTRY_URI:-databricks-uc}
    DATABRICKS_HOST: ${DATABRICKS_HOST:-}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
    AMPOPS_MODEL_NAME: ${AMPOPS_MODEL_NAME:-ampops-demand-forecaster}
    AMPOPS_UC_MODEL_PREFIX: ${AMPOPS_UC_MODEL_PREFIX:-}
    # Where dags/ampops_daily_forecast.py sends POST /predict/batch. Inference
    # only ever happens in the api service — the DAG is a thin HTTP client.
    AMPOPS_API_URL: ${AMPOPS_API_URL:-http://api:8000}
    # Replay mode: the dataset ends 2018-08-02, so "today" is simulated and the
    # DAG forecasts the following 24 hours from seeded observations. A live
    # deployment would need Open-Meteo's forecast API instead.
    AMPOPS_SIMULATED_TODAY: ${AMPOPS_SIMULATED_TODAY:-2018-08-01}
    # Airflow reads connections out of AIRFLOW_CONN_* env vars, so the forecast
    # DAG's Postgres connection needs no manual setup in the UI.
    AIRFLOW_CONN_AMPOPS_DB: postgresql://airflow:airflow@postgres/ampops
    # The Airflow image has no git binary, so MLflow cannot stamp a source Git
    # SHA. Harmless, but GitPython otherwise dumps a 15-line "Bad git
    # executable" block into every training task log.
    GIT_PYTHON_REFRESH: quiet
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    # data/raw stays a host bind mount (read-only) so the two raw CSVs remain
    # drop-in from the host per README "Getting the data". Nothing writes here.
    - ./data/raw:/opt/airflow/data/raw:ro
    # interim/, processed/ and logs/ are named volumes, not bind mounts. Every
    # DAG run rewrites the same fixed paths under them, and that access pattern
    # triggers a per-inode VirtioFS lock bug on macOS that fails ordinary reads
    # and writes with `OSError: [Errno 35] Resource deadlock avoided` — see
    # docs/virtiofs_errno35_deadlock.md. Named volumes live inside the Linux VM
    # and never cross the host-guest bridge, so the bug cannot reach them.
    # Use `make data-export` / `make data-import` to move files across.
    - ampops-data-interim:/opt/airflow/data/interim
    - ampops-data-processed:/opt/airflow/data/processed
    - ampops-logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  # --- Training pipeline -----------------------------------------------------

  postgres:
    image: postgres:15
    container_name: ampops-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the `ampops` database (the forecast system of record) next to
      # Airflow's own. Runs ONLY on a fresh postgres-data volume — existing
      # stacks need `make ampops-db-init`.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    # Pinned to match the mlflow client in requirements-airflow.txt — client/
    # server skew on :latest is a classic source of registry errors.
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: ampops-mlflow
    ports:
      # Host 5050, not 5000: on macOS the AirPlay Receiver (ControlCenter)
      # already owns 0.0.0.0:5000, so publishing there fails with "address
      # already in use". Inside the compose network this is still port 5000,
      # so MLFLOW_TRACKING_URI=http://mlflow:5000 is unaffected.
      - "5050:5000"
    # --serve-artifacts proxies artifact upload through the tracking server.
    # Without it, clients would try to write to /mlartifacts, a path that only
    # exists inside this container, and model logging from Airflow would fail.
    # The backend store lives on the volume too, so runs survive a recreate.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlartifacts/mlflow.db
      --artifacts-destination /mlartifacts
      --serve-artifacts
    volumes:
      - mlflow-data:/mlartifacts
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: ampops-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER:-admin}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Amp --lastname Ops --role Admin \
          --email admin@ampops.local || true
    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    restart: on-failure

  airflow-scheduler:
    <<: *airflow-common
    container_name: ampops-airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    container_name: ampops-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # --- Serving & dashboards (profile: serving) -------------------------------

  api:
    build: .
    container_name: ampops-api
    profiles: ["serving"]
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Redis is the compose backend pair (feature store + forecast cache).
      # "parquet" is the host/test pair and must not be used here.
      AMPOPS_STORE_BACKEND: redis
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mlflow
    volumes:
      - ./app:/app/app
      # src/ is mounted for the same reason the Airflow services mount it: the
      # API's feature builder calls ampops.features.build directly, so an edit
      # there must reach serving without a rebuild.
      - ./src:/app/src
    healthcheck:
      # /health is liveness only and never touches H2O, Redis, or MLflow, so it
      # stays green while the model is still loading. /ready is the readiness
      # signal — check that one when debugging a missing champion.
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  redis:
    image: redis:7-alpine
    container_name: ampops-redis
    profiles: ["serving"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: ampops-prometheus
    profiles: ["serving"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: ampops-grafana
    profiles: ["serving"]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  redis-data:
  mlflow-data:
  postgres-data:
  grafana-data:
  # Pipeline working storage, deliberately off the host bind mount — see the
  # comment on x-airflow-common.volumes above.
  ampops-data-interim:
  ampops-data-processed:
  ampops-logs:
